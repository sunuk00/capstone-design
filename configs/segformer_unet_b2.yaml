# SegFormer-UNet 하이브리드 모델 실험 설정
# MiT-B2 인코더 + U-Net 스타일 CNN 디코더
model_name: "segformer_unet-b2"

# Data
data_root: "data/train_orig"
image_size: 512
val_ratio: 0.2
use_augmentation: false

# Model
base_channels: 32

# Training
batch_size: 4
epochs: 40
lr: 0.0001
seed: 42
num_workers: 0

# Loss
loss_type: "bce_dice"
bce_weight: 0.5
dice_weight: 0.5
pos_weight: 10.0

# Output
output_dir: "outputs/segformer_unet_b2"
