# Model
model_name: "unet++"
base_channels: 32

# Data
data_root: "data/train"
image_size: 512
val_ratio: 0.2
use_augmentation: true

# Training
batch_size: 4
epochs: 200
lr: 0.0001
seed: 42
num_workers: 0

# Loss
loss_type: "bce_dice"
bce_weight: 0.3
dice_weight: 0.7
pos_weight: 10

# Output
output_dir: "outputs/unet/exp001__bce0.3_dice0.7__pos10__data_agumentation__new_data"
save_interval: 1

