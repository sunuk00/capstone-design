# Model
model_name: "unet"
base_channels: 32

# Data
data_root: "data/train"
image_size: 512
val_ratio: 0.2
use_augmentation: true

# Training
batch_size: 8
epochs: 200
lr: 0.0001
seed: 42
num_workers: 0

# Loss
loss_type: "focal_dice"
focal_weight: 0
dice_weight: 0.5
alpha: 0.75
gamma: 2.0

# Output
output_dir: "outputs/unet/exp016__focal0.5_dice0.5__alpha0.75__gamma2.0__data_agumentation__new_data"
save_interval: 1

