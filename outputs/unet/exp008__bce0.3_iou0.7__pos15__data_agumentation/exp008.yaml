# Model
model_name: "unet"
base_channels: 32

# Data
data_root: "data/train"
image_size: 512
val_ratio: 0.2
use_augmentation: true

# Training
batch_size: 8
epochs: 200
lr: 0.0001
seed: 42
num_workers: 0

# Loss
loss_type: "bce_iou"
bce_weight: 0.3
iou_weight: 0.7
pos_weight: 15.0

# Output
output_dir: "outputs/unet/exp_007__bce_iou__pos15__data_augmentation"
save_interval: 1

